name: gcc

on:
  push:
    branches: [ main ]
    paths:
      - 'include/**'
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/gcc.yaml'
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: GCC Debug Build
        run: make deb CC=gcc LINKER=ld

      - name: GCC Release Build
        run: make rel CC=gcc LINKER=ld
