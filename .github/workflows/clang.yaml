name: clang

on:
  push:
    branches: [ main ]
    paths:
      - 'include/**'
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/clang.yaml'
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang lld

      - name: Clang Debug Build
        run: make deb CC=clang LINKER=lld

      - name: Clang Sanitizer Build
        run: make san CC=clang LINKER=lld

      - name: Clang Release Build
        run: make rel CC=clang LINKER=lld
